<!-- jsPsych core + the three stock plugins this task uses (versions pinned on purpose) -->
<script src="https://unpkg.com/jspsych@8.3.0/dist/index.browser.min.js"></script>
<script src="https://unpkg.com/@jspsych/plugin-instructions@2.1.0/dist/index.browser.min.js"></script>
<script src="https://unpkg.com/@jspsych/plugin-survey-text@2.1.1/dist/index.browser.min.js"></script>
<script src="https://unpkg.com/@jspsych/plugin-html-button-response@2.1.0/dist/index.browser.min.js"></script>

<style>
  /* ---------- Chat UI. Deliberately looks like an ordinary messaging app: credibility over flair. ---------- */
  :root {
    --page: #E9EDF1;
    --surface: #FFFFFF;
    --ink: #1E2A36;
    --muted: #697584;
    --partner-bubble: #EDF0F4;
    --own-bubble: #2B5F8E;
    --note: #FFF4CC;
    --note-edge: #E3CF7F;
    --online: #3E9B5F;
    --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  body { background: var(--page); font-family: var(--font); color: var(--ink); }
  .jspsych-display-element { font-family: var(--font); font-size: 16px; }
  .jspsych-content { max-width: 960px; }

  .task { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 20px;
          width: min(920px, 94vw); text-align: left; align-items: start; }
  @media (max-width: 720px) { .task { grid-template-columns: 1fr; } }

  .note { background: var(--note); border: 1px solid var(--note-edge); border-radius: 6px;
          padding: 16px 18px; line-height: 1.5; box-shadow: 0 1px 0 rgba(0,0,0,.04); }
  .note h2 { font-size: 14px; font-weight: 600; margin: 0 0 10px; color: #6A5A1C; }
  .note dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; }
  .note dt { color: #6A5A1C; font-size: 14px; }
  .note dd { margin: 0; font-weight: 600; }
  .note p.hint { margin: 14px 0 0; font-size: 13px; color: #6A5A1C; }

  .chat { background: var(--surface); border-radius: 14px; display: flex; flex-direction: column;
          height: min(560px, 78vh); overflow: hidden; border: 1px solid #D6DCE3; }
  .chat header { display: flex; align-items: center; gap: 12px; padding: 12px 16px;
                 border-bottom: 1px solid #E3E7EC; }
  .avatar { width: 36px; height: 36px; border-radius: 50%; background: #C9D3DE; color: #33475B;
            display: grid; place-items: center; font-weight: 600; font-size: 14px; }
  .who { line-height: 1.25; }
  .who strong { display: block; font-size: 15px; }
  .who span { font-size: 13px; color: var(--muted); }
  .who span::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%;
                      background: var(--online); margin-right: 6px; vertical-align: 1px; }

  .log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
  .msg { max-width: 78%; padding: 9px 13px; border-radius: 16px; line-height: 1.4; word-wrap: break-word; }
  .msg.partner { align-self: flex-start; background: var(--partner-bubble); border-bottom-left-radius: 5px; }
  .who span.offline::before { display: none; }
  .msg.system { align-self: center; background: none; color: var(--muted); font-size: 13px; padding: 2px 8px; }
  .waiting .partner-id { font-weight: 600; color: var(--ink); }
  .msg.self { align-self: flex-end; background: var(--own-bubble); color: #fff; border-bottom-right-radius: 5px; }
  .typing { align-self: flex-start; background: var(--partner-bubble); border-radius: 16px;
            padding: 12px 14px; display: flex; gap: 4px; }
  .typing i { width: 7px; height: 7px; border-radius: 50%; background: #93A0AE; animation: blink 1.2s infinite; }
  .typing i:nth-child(2) { animation-delay: .2s; } .typing i:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 60%, 100% { opacity: .3; } 30% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .typing i { animation: none; opacity: .6; } }

  .composer { display: flex; gap: 8px; padding: 12px; border-top: 1px solid #E3E7EC; }
  .composer input { flex: 1; font: inherit; padding: 10px 14px; border: 1px solid #C5CED8; border-radius: 20px; }
  .composer input:focus-visible { outline: 2px solid var(--own-bubble); outline-offset: 1px; }
  .composer input:disabled { background: #F3F5F7; }
  .composer button { font: inherit; font-weight: 600; padding: 0 18px; border: 0; border-radius: 20px;
                     background: var(--own-bubble); color: #fff; cursor: pointer; }
  .composer button:disabled { background: #A9B7C6; cursor: default; }
  .composer button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .nudge { min-height: 20px; font-size: 13px; color: #9A3B2A; padding: 0 16px 8px; }

  .waiting { width: min(460px, 90vw); text-align: center; line-height: 1.6; }
  .waiting .status { color: var(--muted); }
  .instr { max-width: 620px; text-align: left; line-height: 1.6; }
  .note .ask-text { margin: 10px 0 0; padding: 10px 12px; background: rgba(255,255,255,.6); border-radius: 6px; font-weight: 600; line-height: 1.45; }
  .note p { margin: 0; line-height: 1.5; }
</style>
</head>

/* =====================================================================================
   BUILD THE TRIAL LIST (Latin square)
   Within each item type (original, chat) the 24 items form 8 groups of 3. For list L, group g goes
   to cell (g + L) mod 8: cells 0-3 = participant ANSWERS in i_i / i_you / you_i / you_you,
   cells 4-7 = participant ASKS (partner answers) in the same four. Per participant: 24 answers
   (6 per I/you cell: 3 original + 3 chat) and 24 asks. Across the 8 lists every item appears in
   every cell and role. Turns alternate: partner asks, participant asks, partner asks, ...
   ===================================================================================== */
// The two item sets (24 each), counterbalanced separately so every cell gets the same mix of both.
const ITEM_TYPES = [...new Set(window.ITEMS.map(it => it.type))];

function buildTrials(list) {
  const okRuns = (arr) => arr.every((t, i) => i < 2 || !(t.cell === arr[i - 1].cell && t.cell === arr[i - 2].cell));
  if (!PARTICIPANT_ASKS) {
    // 4 lists: within each item set, 24 items = 4 groups of 6; group g -> cell (g + list) mod 4.
    // Participant answers all 48: 12 per cell (6 from each item set).
    const all = [];
    for (const type of ITEM_TYPES) {
      const its = window.ITEMS.filter(it => it.type === type).sort((a, b) => a.id.localeCompare(b.id));
      its.forEach((it, i) => all.push({ item: it, cell: CELLS[(Math.floor(i / 6) + list) % 4], role: "answer" }));
    }
    let A; do { A = jsPsych.randomization.shuffle(all); } while (!okRuns(A));
    return A.map((t, i) => ({
      turn: i + 1, role: "answer", item_id: t.item.id, item_type: t.item.type, fh_item: t.item.fh_item,
      behavior: t.item.behavior, cell: t.cell, main_target: t.cell.split("_")[0], emb_target: t.cell.split("_")[1],
      scenario: t.item.scenario[t.cell], partner_that: null, partner_answer: null
    }));
  }
  const answer = [], ask = [];
  for (const type of ITEM_TYPES) {
    const its = window.ITEMS.filter(it => it.type === type).sort((a, b) => a.id.localeCompare(b.id));
    its.forEach((it, i) => {
      const cellIdx = (Math.floor(i / 3) + list) % 8;
      const t = { item: it, cell: CELLS[cellIdx % 4], role: cellIdx < 4 ? "answer" : "ask" };
      (t.role === "answer" ? answer : ask).push(t);
    });
  }
  // Partner's "that": exactly PARTNER_THAT_RATE of the partner's answers in each cell
  for (const c of CELLS) {
    const inCell = jsPsych.randomization.shuffle(ask.filter(t => t.cell === c));
    const k = Math.round(inCell.length * PARTNER_THAT_RATE);
    inCell.forEach((t, i) => { t.partner_that = i < k; });
  }
  // Order: random, with no more than 2 answer trials in a row from the same cell (as in F&H)
  let A; do { A = jsPsych.randomization.shuffle(answer); } while (!okRuns(A));
  const B = jsPsych.randomization.shuffle(ask);
  const order = [];
  A.forEach((t, i) => { order.push(t); if (B[i]) order.push(B[i]); });
  return order.map((t, i) => ({
    turn: i + 1, role: t.role, item_id: t.item.id, item_type: t.item.type, fh_item: t.item.fh_item,
    behavior: t.item.behavior, cell: t.cell,
    main_target: t.cell.split("_")[0], emb_target: t.cell.split("_")[1],
    scenario: t.item.scenario[t.cell],
    partner_that: t.role === "ask" ? t.partner_that : null,
    partner_answer: t.role === "ask"
      ? `${t.cell.startsWith("i_") ? "I" : "You"} believe ${t.partner_that ? "that " : ""}${t.item.answer_rest[t.cell]}.`
      : null
  }));
}
if (!Array.isArray(window.ITEMS) || window.ITEMS.length !== 48) {
  document.body.innerHTML = center("The study materials didn't load. Please contact the researcher.");
  throw new Error("ITEMS missing or wrong length");

const TRIALS = buildTrials(LIST);
if (DEBUG) { window.__buildTrials = buildTrials; window.__codeAnswer = (...a) => codeAnswer(...a); }   // tests only

// Safety check: partner-authored text (other than its scripted answers) must be "that"-free.

/* =====================================================================================
   CODING HELPERS (automatic first pass; hand-check before analysis)
   ===================================================================================== */
function codeAnswer(text, keylog, trial) {
  const t = text.trim();
  // Main verb: "believe" is the target; "think" is coded too (F&H Exp. 2 used it), other verbs are not.
  const V = "(believes?|thinks?)";
  const m = t.match(new RegExp("^\\W*(i|you)\\s+(?:\\w+\\s+)?" + V + "\\b", "i"));   // allows "I really believe"
  const mainProd = m ? m[1].toLowerCase() : null;
  const verbProd = m ? m[2].toLowerCase().replace(/s$/, "") : null;
  // Embedded subject, including apostrophe-less typing ("im", "youre")
  const e = t.match(new RegExp(V + "\\s+(that\\s+)?(i|i'm|im|i've|ive|you|you're|youre|you've|youve|ur|u)\\b", "i"));
  // Full clause required after the embedded subject: a contraction ("I'm", "youre") or at least one more
  // word. Rules out "I believe you." (direct object) and cut-off answers like "You believe that I".
  const clauseRe = new RegExp(V + "\\s+(that\\s+)?(?:(?:i'm|im|i've|ive|you're|youre|you've|youve)\\b|(?:i|you|u|ur)\\s+[a-z])", "i");
  const embProd = e && clauseRe.test(t) ? (/^i/i.test(e[3]) ? "i" : "you") : null;
  const thatRe = new RegExp(V + "\\s+that\\b", "i");
  const iThat = keylog.findIndex(k => thatRe.test(k[3]));
  const iVerb = keylog.findIndex(k => new RegExp(V + "\\s$", "i").test(k[3]));
  const iEmb  = keylog.findIndex(k => new RegExp(V + "\\s+(that\\s+)?[a-z]", "i").test(k[3]));
  return {
    that_mentioned: thatRe.test(t),                                   // "that" right after believe/think
    main_prod: mainProd, verb_prod: verbProd, emb_prod: embProd,
    valid_structure: mainProd === trial.main_target && embProd === trial.emb_target,   // any coded verb
    valid_believe: mainProd === trial.main_target && embProd === trial.emb_target && verbProd === "believe",
    that_first_pass: iThat < 0 ? null : keylog[iThat][2] === keylog[iThat][3].length,
    that_deleted: keylog.some((k, i) => i > 0 && thatRe.test(keylog[i - 1][3]) && !thatRe.test(k[3])),
    verb_done_ms: iVerb < 0 ? null : keylog[iVerb][0],               // "believe " finished
    embedded_onset_ms: iEmb < 0 ? null : keylog[iEmb][0],            // first letter after believe (that)
    n_words: t.split(/\s+/).filter(Boolean).length,
    n_input_events: keylog.length,
    n_deletions: keylog.filter(k => k[1].startsWith("delete")).length
  };
}

/* =====================================================================================
   PLUGIN 1: waiting room (same duration distribution in both conditions)
   ===================================================================================== */
class WaitingRoomPlugin {
  static info = {
    name: "waiting-room", version: "0.3.0", parameters: {},
    data: { wait_ms: { type: jsPsychModule.ParameterType.INT },
            pairing_retry: { type: jsPsychModule.ParameterType.BOOL } }
  };
  constructor(jsPsych) { this.jsPsych = jsPsych; }
  trial(display) {
    const ms = (r) => DEBUG ? 300 : Math.round(rand(...r));
    const retry = Math.random() < PAIRING.retryChance;
    const steps = [[LABEL.searching, ms(PAIRING.search)]];
    if (retry) steps.push([LABEL.retry, DEBUG ? 300 : PAIRING.retryNotice + ms(PAIRING.secondSearch)]);
    steps.push([LABEL.found, DEBUG ? 300 : PAIRING.found]);
    display.innerHTML = `<div class="waiting"><p class="status" aria-live="polite"></p></div>`;
    const status = display.querySelector(".status");
    let t = 0;
    steps.forEach(([html, dur]) => {
      this.jsPsych.pluginAPI.setTimeout(() => { status.innerHTML = html; }, t);
      t += dur;
    });
    this.jsPsych.pluginAPI.setTimeout(() => this.jsPsych.finishTrial({ wait_ms: t, pairing_retry: retry }), t);
  }
}

/* =====================================================================================
   PLUGIN 2: one turn of the chat.
     role "answer": partner types a scenario + question; participant types an answer (the DV).
     role "ask":    partner reacts, participant sends a scenario + question; partner types its answer.
   Conversation history persists across trials. Keystroke log on answers:
   [ms since box enabled, inputType, cursor position, full text]
   ===================================================================================== */
const CHAT_HISTORY = [{ who: "system", text: LABEL.joined }];

class ChatTurnPlugin {
  static info = {
    name: "chat-turn", version: "0.3.0",
    parameters: { spec: { type: jsPsychModule.ParameterType.OBJECT, default: {} },
                  min_words: { type: jsPsychModule.ParameterType.INT, default: MIN_WORDS } },
    data: { response_text: { type: jsPsychModule.ParameterType.STRING },
            keylog: { type: jsPsychModule.ParameterType.STRING } }
  };
  constructor(jsPsych) { this.jsPsych = jsPsych; }

  trial(display, trial) {
    const s = trial.spec;
    const esc = (x) => String(x).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    const guide = s.role === "answer"
      ? `<h2>Your turn to answer</h2><p>Answer your partner's question in a complete sentence.</p>`
      : `<h2>Your turn to ask</h2><p>Send this to your partner:</p><p class="ask-text">${esc(s.scenario)}</p>`;

    display.innerHTML = `
      <div class="task">
        <aside class="note" aria-label="Your turn">${guide}</aside>
        <section class="chat" aria-label="Chat">
          <header>
            <div class="avatar" aria-hidden="true">${esc(LABEL.avatar)}</div>
            <div class="who"><strong>${esc(LABEL.name)}</strong><span>${esc(LABEL.subtitle)}</span></div>
          </header>
          <div class="log" role="log" aria-live="polite"></div>
          <div class="nudge" aria-live="assertive"></div>
          <form class="composer" autocomplete="off">
            <input type="text" aria-label="Type your message" placeholder="Wait for your partner…" disabled
                   spellcheck="false" autocorrect="off" autocapitalize="sentences">
            <button type="submit" disabled>Send</button>
          </form>
        </section>
      </div>`;

    const log = display.querySelector(".log"), box = display.querySelector("input");
    const send = display.querySelector("button"), form = display.querySelector("form");
    const nudge = display.querySelector(".nudge");
    const addBubble = (who, text) => {
      const b = document.createElement("div");
      b.className = `msg ${who}`; b.textContent = text; log.appendChild(b); log.scrollTop = log.scrollHeight;
    };
    CHAT_HISTORY.forEach(m => addBubble(m.who, m.text));

    const t0 = performance.now(), partnerLog = [];
    const typeOut = (msgs, done, i = 0) => {
      if (i >= msgs.length) return done();
      const text = msgs[i];
      const paste = text === s.scenario;            // scenarios come from the partner's prepared list
      const pause = DEBUG ? 100 : rand(...(i === 0 ? TIMING.readDelay : TIMING.betweenMessages));
      this.jsPsych.pluginAPI.setTimeout(() => {
        const dots = document.createElement("div");
        dots.className = "typing"; dots.setAttribute("aria-label", "Partner is typing");
        dots.innerHTML = "<i></i><i></i><i></i>"; log.appendChild(dots); log.scrollTop = log.scrollHeight;
        this.jsPsych.pluginAPI.setTimeout(() => {
          dots.remove(); addBubble("partner", text); CHAT_HISTORY.push({ who: "partner", text });
          partnerLog.push({ text, shown_at: Math.round(performance.now() - t0) });
          typeOut(msgs, done, i + 1);
        }, typingTime(text, paste));
      }, pause);
    };

    const data = { task: "chat", ...s, partner_messages: null };
    const finish = () => {
      data.partner_messages = JSON.stringify(partnerLog);
      this.jsPsych.pluginAPI.setTimeout(() => this.jsPsych.finishTrial(data), 350);
    };

    if (s.role === "ask") {
      // Participant sends the prepared question (read-only), then the partner answers.
      const sendQuestion = () => {
        box.value = s.scenario; box.readOnly = true; box.disabled = false; send.disabled = false;
        box.placeholder = ""; send.focus();
      };
      const opener = CHAT_HISTORY.length > 1 ? [REACTIONS[Math.floor(Math.random() * REACTIONS.length)]] : [];
      form.addEventListener("submit", (e) => {
        e.preventDefault();
        box.value = ""; box.disabled = true; send.disabled = true;
        addBubble("self", s.scenario); CHAT_HISTORY.push({ who: "self", text: s.scenario });
        typeOut([s.partner_answer], finish);
      });
      typeOut(opener, sendQuestion);
      return;
    }

    // role "answer"
    let keylog = [], tEnabled = null, firstInput = null, pasteAttempts = 0;
    const enableInput = () => {
      box.value = ""; box.disabled = false; send.disabled = false; box.placeholder = "Type your answer";
      box.focus(); tEnabled = performance.now();
    };
    box.addEventListener("input", (e) => {
      const t = Math.round(performance.now() - tEnabled);
      if (firstInput === null) firstInput = t;
      keylog.push([t, e.inputType || "", box.selectionStart, box.value]); nudge.textContent = "";
    });
    box.addEventListener("paste", (e) => {
      e.preventDefault(); pasteAttempts++;
      keylog.push([Math.round(performance.now() - tEnabled), "pasteBlocked", box.selectionStart, box.value]);
      nudge.textContent = "Please type your answer rather than pasting it.";
    });
    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const text = box.value.trim();
      if (text.split(/\s+/).filter(Boolean).length < trial.min_words) {
        nudge.textContent = "Please answer in a complete sentence (more than three words)."; return;
      }
      const rtSend = Math.round(performance.now() - tEnabled);
      box.value = ""; box.disabled = true; send.disabled = true;
      addBubble("self", text); CHAT_HISTORY.push({ who: "self", text });
      Object.assign(data, { response_text: text, rt_first_input: firstInput, rt_send: rtSend,
                            paste_attempts: pasteAttempts, keylog: JSON.stringify(keylog) },
                    codeAnswer(text, keylog, s));
      finish();
    });
    const opener = CHAT_HISTORY.length <= 1 ? OPENING
      : (!PARTICIPANT_ASKS && Math.random() < REACTION_RATE) ? [REACTIONS[Math.floor(Math.random() * REACTIONS.length)]] : [];
    data.partner_reacted = opener.length > 0 && CHAT_HISTORY.length > 1;
    typeOut(opener.concat([s.scenario]), enableInput);
  }
}

/* =====================================================================================
   PLUGIN 3: practice question with feedback (before pairing; nothing here is "sent" to anyone)
   ===================================================================================== */
class PracticePlugin {
  static info = {
    name: "practice-turn", version: "0.1.0",
    parameters: { spec: { type: jsPsychModule.ParameterType.OBJECT, default: {} } },
    data: { response_text: { type: jsPsychModule.ParameterType.STRING } }
  };
  constructor(jsPsych) { this.jsPsych = jsPsych; }
  trial(display, trial) {
    const s = trial.spec;
    display.innerHTML = `
      <div class="task">
        <aside class="note" aria-label="Practice"><h2>Practice ${s.n} of ${PRACTICE.length}</h2>
          <p>Answer in a complete sentence, starting with "I believe" or "You believe". You'll get feedback.</p></aside>
        <section class="chat" aria-label="Practice chat">
          <header><div class="avatar" aria-hidden="true">?</div>
            <div class="who"><strong>Practice round</strong><span class="offline">Not connected yet</span></div></header>
          <div class="log" role="log" aria-live="polite"></div>
          <div class="nudge" aria-live="assertive"></div>
          <form class="composer" autocomplete="off">
            <input type="text" aria-label="Type your answer" placeholder="Type your answer" spellcheck="false" autocorrect="off">
            <button type="submit">Send</button>
          </form>
        </section>
      </div>`;
    const log = display.querySelector(".log"), box = display.querySelector("input");
    const send = display.querySelector("button"), form = display.querySelector("form"), nudge = display.querySelector(".nudge");
    const add = (who, text) => { const b = document.createElement("div"); b.className = `msg ${who}`;
      b.textContent = text; log.appendChild(b); log.scrollTop = log.scrollHeight; };
    add("partner", s.scenario); box.focus();
    const main = s.cell.split("_")[0], emb = s.cell.split("_")[1];
    const attempts = [];
    box.addEventListener("input", () => { nudge.textContent = ""; });
    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const text = box.value.trim(); attempts.push(text);
      const c = codeAnswer(text, [], { main_target: main, emb_target: emb });
      let msg = null;
      if (text.split(/\s+/).filter(Boolean).length < MIN_WORDS) msg = "Please answer in a complete sentence (more than three words).";
      else if (!c.main_prod || !c.verb_prod) msg = 'Please start your answer with "I believe" or "You believe".';
      else if (c.main_prod !== main) msg = main === "i"
        ? 'The question asks what you believe, so start with "I believe".'
        : 'The question asks what your partner believes, so start with "You believe".';
      else if (!c.emb_prod) msg = "Finish the sentence: say what is believed about the person.";
      if (msg) { nudge.textContent = msg; return; }
      box.disabled = true; send.disabled = true; box.value = "";
      add("self", text);
      this.jsPsych.pluginAPI.setTimeout(() => add("system", "Good, exactly the right format."), 400);
      this.jsPsych.pluginAPI.setTimeout(() => this.jsPsych.finishTrial({
        task: "practice", item_id: s.id, cell: s.cell, response_text: text,
        n_attempts: attempts.length, attempts: JSON.stringify(attempts) }), DEBUG ? 600 : 1800);
    });
  }
}

  questions: [
    { prompt: "In a sentence or two, what do you think this study was about?", rows: 3, required: true, name: "probe_purpose" },
    { prompt: "Did anything about your partner seem unusual? If so, what?", rows: 3, required: true, name: "probe_partner" }
  ],
  data: { task: "probe_open" }
};
const probeBelief = {
  type: jsPsychHtmlButtonResponse,
  stimulus: "<p class='instr'>Honestly, who do you think you were chatting with?</p>",
  choices: ["Another person", "An AI system", "I'm not sure"],
  data: { task: "probe_belief" },
  on_finish: (d) => { d.belief = ["person", "ai", "unsure"][d.response]; }
};
// After learning about the deception, participants choose whether their data are kept.
// Rows from anyone with keep_data = false must be deleted before analysis.
const debrief = {
  type: jsPsychHtmlButtonResponse, stimulus: DEBRIEF_HTML,
  choices: ["Keep my responses", "Remove my responses"], data: { task: "debrief" },
  on_finish: (d) => { d.keep_data = d.response === 0; jsPsych.data.addProperties({ keep_data: d.keep_data }); }
};

const practiceIntro = {
  type: jsPsychHtmlButtonResponse, choices: ["Start practice"], data: { task: "practice_intro" },
  stimulus: `<div class="instr"><h2>Practice first</h2>
    <p>Before you're connected, try ${PRACTICE.length} practice questions. You'll get feedback on the format.
    These answers aren't sent to anyone.</p></div>`
};
const practiceTrials = PRACTICE.map((spec, i) => ({ type: PracticePlugin, spec: { ...spec, n: i + 1 } }));
const practiceDone = {
  type: jsPsychHtmlButtonResponse, choices: ["Continue"], data: { task: "practice_done" },
  stimulus: `<div class="instr"><h2>Practice done</h2><p>Next, you'll be connected for the real chat.</p></div>`
};

const notice = {
  type: jsPsychHtmlButtonResponse, stimulus: `<div class="instr">${LABEL.notice}</div>`,
  choices: ["Continue"], data: { task: "notice" }
};

jsPsych.run([consent, instructions, practiceIntro, ...practiceTrials, practiceDone, notice, { type: WaitingRoomPlugin }, ...chatTrials, probeOpen, probeBelief, debrief]);
</script>
